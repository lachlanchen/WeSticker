x-runtime: &runtime
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:size=64m,noexec,nosuid,nodev"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 96
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "2"}
services:
  web:
    <<: *runtime
    build: .
    image: westicker:local
    ports: ["127.0.0.1:${WESTICKER_WEB_PORT:-18644}:8000"]
    volumes:
      - state:/data
      - ${WESTICKER_DOCKER_CONFIG:-./.config/production.json}:/run/secrets/westicker.json:ro
      - ${WESTICKER_AGENT_TOKEN:-./.config/agent-token}:/run/secrets/agent-token:ro
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
  worker:
    <<: *runtime
    image: westicker:local
    command: [python, -m, server.worker]
    volumes: ["state:/data", "${WESTICKER_DOCKER_CONFIG:-./.config/production.json}:/run/secrets/westicker.json:ro"]
    mem_limit: 768m
    cpus: 1
    depends_on: [web]
  retention:
    <<: *runtime
    image: westicker:local
    command: [sh, -c, "while true; do python scripts/retention.py; sleep 3600; done"]
    volumes: ["state:/data", "${WESTICKER_DOCKER_CONFIG:-./.config/production.json}:/run/secrets/westicker.json:ro"]
    mem_limit: 128m
    cpus: 0.25
    depends_on: [web]
volumes:
  state:
